<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label> Portfolio</label>
      <fieldset>
        <legend>Personal Info</legend>
        <label>Full Name : </label>

        <input type="text" />
        <br><br>

        <label>Phone no. : </label>
        <input type="tel" />
        <br><br>

        <label>Email</label>
        <input type="email" />
        <br><br>

        <label>DoB</label>
        <input type="date" />
        <br><br>

        <label>Age</label>
        <input type="number" />
        <br><br>

        <label>Gender</label>
        <input type="radio" />Male <input type="radio" />Female
        <br><br>

        <label> Country : </label>
        <select>
          <option>India</option>
          <option>USA</option>
          <option>UK</option>
        </select>

    
      </fieldset>
<br>
      <fieldset>

        <legend>Profile Info</legend>

        <label>Year of Experience</label>
        <input type="number">

        <br><br>

        <label>DevType</label>
        <input type="checkbox" >Mobile

        <input type="checkbox" >Backend
        <br>

        <label>Skills</label>
        <input type="range" >
        <br><br>

        <label>Upload Resume</label>

      </fieldset>
      <br><br>


      <fieldset>

        <legend>Extra Curriculam</legend>
        <br><br>

        <label>Hobbies</label>

        <input type="checkbox">Sport
        <input type="checkbox">Reading
        <input type="checkbox">Music

        <br>

        <label>Other Achievement : </label>

        <textarea></textarea>

      </fieldset>

      <br><br>
    <input type="submit">
    <input type="reset">


    </form>
