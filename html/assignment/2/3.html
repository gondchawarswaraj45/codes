
<!DOCTYPE html>
<html>
<head>
    <title>HTML Text Formatting</title>
</head>
<body>
    <h1>HTML Text Formatting</h1>

    <p>
        <strong>Important</strong>,
        <b>Bold</b>,
        <em>Emphasized</em>,
        <i>Italic</i> and
        <u>Underlined</u> text.
    </p>

    <p>This is <mark>highlighted</mark> text.</p>
    <p><small>This is a disclaimer.</small></p>

    <p>Mathematics: x<sup>2</sup></p>
    <p>Chemistry: H<sub>2</sub>O</p>

    <p>
        &lt;strong&gt; gives importance, while
        &lt;b&gt; makes text bold.
    </p>
</body>
</html>
