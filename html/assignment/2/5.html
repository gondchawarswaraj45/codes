<!doctype html>
<html>
  <head>
    <title>Block vs Inline Elements</title>
  </head>
  <body>
    <div>
      <h1>Block and Inline Elements</h1>
      <p>Block elements start on a new line.</p>
      <p>This is another block element.</p>
    </div>

    <p>
      HTML is <span>important</span> for <strong>web development</strong>. Visit
      <a href="https://www.google.com">Google</a>.
    </p>

    <h2>Block Elements</h2>
    <div>DIV element</div>
    <p>Paragraph element</p>
    <h3>Heading element</h3>

    <h2>Inline Elements</h2>
    <span>SPAN</span>
    <b>Bold</b>
    <i>Italic</i>

    <p>This paragraph begins on a new line.</p>
  </body>
</html>
